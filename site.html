<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TREND — هدايا وإكسسوار وعطور | دمر، دمشق</title>
<meta name="description" content="TREND (بيوتي غاليري سابقًا) — هدايا، إكسسوار، ألعاب، مكياج وعطور. دمشق، دمر البلد مقابل صالون الرفاعي. توصيل داخل دمشق.">
<meta name="theme-color" content="#100D0C">
<meta property="og:title" content="TREND — هدايا وإكسسوار وعطور">
<meta property="og:description" content="دمشق، دمر البلد — مقابل صالون الرفاعي. توصيل داخل دمشق.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&text=TREND&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#100D0C;--panel:#191413;--panel2:#221B19;
  --gold:#C6A44E;--gold-lt:#EBD9A8;--gold-dk:#8E7434;
  --line:rgba(198,164,78,.16);--line2:rgba(198,164,78,.34);
  --paper:#F3EEE7;--muted:#96897E;--wa:#25D366;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  background:var(--ink);color:var(--paper);
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif;
  font-weight:300;line-height:1.85;-webkit-font-smoothing:antialiased;
  padding-bottom:78px;
}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}

/* ——— الترويسة ——— */
header{
  text-align:center;padding:52px 18px 38px;
  background:radial-gradient(120% 80% at 50% 0%,#241C19,transparent 62%);
}
.wordmark{
  font-family:"Cormorant Garamond",Georgia,serif;font-weight:300;
  font-size:clamp(40px,13vw,56px);line-height:1;letter-spacing:.32em;
  direction:ltr;margin-right:-.32em;color:var(--gold-lt);
}
.former{font-size:14px;color:var(--muted);margin-top:8px;letter-spacing:.05em}
.tag{font-size:13px;color:var(--muted);margin-top:16px;letter-spacing:.03em}
.rule{width:120px;height:1px;margin:22px auto 0;
  background:linear-gradient(90deg,transparent,var(--line2),var(--gold),var(--line2),transparent)}

/* ——— أزرار سريعة ——— */
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:28px 0 8px}
.qbtn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--line2);padding:15px 10px;font-size:13.5px;
  letter-spacing:.04em;color:var(--gold-lt);transition:.2s;
}
.qbtn:hover{background:var(--panel2);border-color:var(--gold)}
.qbtn svg{width:17px;height:17px;fill:currentColor;flex:0 0 17px}

/* ——— الأقسام ——— */
section{margin-top:46px}
.h{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.h span:first-child,.h span:last-child{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line2))}
.h span:last-child{background:linear-gradient(90deg,var(--line2),transparent)}
.h b{font-size:11.5px;font-weight:400;letter-spacing:.26em;color:var(--gold);white-space:nowrap}

/* ——— العروض ——— */
.offer{
  display:flex;align-items:center;gap:14px;border:1px solid var(--line);
  background:linear-gradient(178deg,var(--panel2),var(--panel));
  padding:13px 15px;margin-bottom:10px;
}
.offer img{width:60px;height:60px;object-fit:cover;flex:0 0 60px;border:1px solid var(--line);background:#0E0B0A}
.o-name{font-size:14.5px;line-height:1.5}
.o-note{font-size:11.5px;color:var(--muted)}
.o-price{display:flex;gap:9px;align-items:baseline;margin-top:5px}
.o-new{font-size:16px;color:var(--gold-lt)}
.o-old{font-size:12.5px;color:var(--muted);text-decoration:line-through;opacity:.75}

/* ——— الفلاتر ——— */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1px solid var(--line2);color:var(--muted);
  padding:8px 16px;font-size:12.5px;letter-spacing:.04em;cursor:pointer;transition:.2s;
}
.chip.on{border-color:var(--gold);color:var(--ink);
  background:linear-gradient(120deg,var(--gold-dk),#E0CB92 45%,var(--gold))}

/* ——— المنتجات ——— */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.prod{border:1px solid var(--line);background:linear-gradient(178deg,var(--panel2),var(--panel));display:flex;flex-direction:column}
.thumb{aspect-ratio:1/1;background:#0E0B0A;overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.noimg{display:flex;align-items:center;justify-content:center;height:100%;color:var(--line2);font-size:26px}
.pbody{padding:11px 12px 13px;flex:1;display:flex;flex-direction:column}
.p-name{font-size:13.5px;line-height:1.55}
.p-cat{font-size:10.5px;color:var(--muted);letter-spacing:.1em;margin-top:2px}
.p-price{font-size:15px;color:var(--gold-lt);margin-top:7px}
.p-ask{
  margin-top:10px;border:1px solid var(--line2);text-align:center;
  padding:8px;font-size:11.5px;color:var(--muted);letter-spacing:.06em;transition:.2s;
}
.p-ask:hover{color:var(--gold-lt);border-color:var(--gold)}
.skel{height:210px;border:1px solid var(--line);background:var(--panel);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:.85}}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:26px 0}

/* ——— المعلومات ——— */
.info{border:1px solid var(--line);background:linear-gradient(178deg,var(--panel2),var(--panel));padding:22px 20px}
.irow{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.irow:last-child{border-bottom:0;padding-bottom:0}
.irow:first-child{padding-top:0}
.ik{flex:0 0 88px;font-size:11px;letter-spacing:.14em;color:var(--gold);padding-top:4px}
.iv{flex:1;font-size:13.5px;line-height:1.8}
.iv small{color:var(--muted);font-size:12px}

/* ——— دعوة ——— */
.cta{
  display:block;text-align:center;margin-top:14px;
  background:linear-gradient(120deg,var(--gold-dk),#E0CB92 42%,var(--gold) 62%,var(--gold-dk));
  color:var(--ink);padding:17px;font-size:12.5px;font-weight:500;letter-spacing:.18em;
}

footer{text-align:center;padding:44px 18px 26px;font-size:11.5px;color:var(--muted);letter-spacing:.05em}
.fr{width:40px;height:1px;margin:0 auto 16px;background:linear-gradient(90deg,transparent,var(--line2),transparent)}

/* ——— واتساب ثابت ——— */
.wafab{
  position:fixed;bottom:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;justify-content:center;gap:9px;
  background:var(--wa);color:#08240F;padding:16px;
  font-size:13.5px;font-weight:500;letter-spacing:.06em;
  box-shadow:0 -10px 30px -18px rgba(0,0,0,.9);
}
.wafab svg{width:19px;height:19px;fill:currentColor}
</style>
</head>
<body>

<header>
  <div class="wordmark">TREND</div>
  <div class="former">بيوتي غاليري</div>
  <p class="tag">هدايا · إكسسوار · ألعاب · مكياج · عطور</p>
  <div class="rule"></div>
</header>

<div class="wrap">

  <nav class="quick">
    <a class="qbtn" id="mapBtn" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 00-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 00-7-7zm0 9.5A2.5 2.5 0 1112 6.5a2.5 2.5 0 010 5z"/></svg>
      الموقع على الخريطة
    </a>
    <a class="qbtn" id="callBtn">
      <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 006.6 6.6l2.2-2.2a1 1 0 011-.25 11 11 0 003.5.55 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.2.2 2.4.55 3.5a1 1 0 01-.25 1z"/></svg>
      اتصال
    </a>
  </nav>

  <section id="offersSec" hidden>
    <div class="h"><span></span><b>عروض اليوم</b><span></span></div>
    <div id="offerList"></div>
  </section>

  <section>
    <div class="h"><span></span><b>المنتجات</b><span></span></div>
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid">
      <div class="skel"></div><div class="skel"></div><div class="skel"></div>
      <div class="skel"></div><div class="skel"></div><div class="skel"></div>
    </div>
  </section>

  <section>
    <div class="h"><span></span><b>المحل</b><span></span></div>
    <div class="info">
      <div class="irow"><div class="ik">العنوان</div><div class="iv" id="vAddr"></div></div>
      <div class="irow"><div class="ik">الدوام</div><div class="iv" id="vHours"></div></div>
      <div class="irow"><div class="ik">التوصيل</div><div class="iv" id="vDeliv"></div></div>
    </div>
    <a class="cta" id="wheelBtn">جرّب حظك واربح حسم</a>
  </section>

</div>

<footer>
  <div class="fr"></div>
  TREND — دمشق، دمر البلد
</footer>

<a class="wafab" id="waBtn" target="_blank" rel="noopener">
  <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 00-8.6 15L2 22l5.2-1.3A10 10 0 1012 2zm5.1 14.1c-.2.6-1.2 1.2-1.7 1.2-.4 0-1 .1-3.2-.8-2.7-1.1-4.4-3.9-4.6-4.1-.1-.2-1-1.4-1-2.6s.6-1.8.9-2.1c.2-.2.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.3.3c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.1 1 2 1.3 2.3 1.4.2.1.4.1.6-.1l.8-1c.2-.2.3-.2.5-.1l2 .9c.2.1.4.2.4.3.1.2.1.7-.1 1.3z"/></svg>
  تواصل على واتساب
</a>

<script>
/* ————— الإعدادات ————— */
var CONFIG = {
  whatsapp: "963934589893",
  phone:    "0934589893",
  address:  "دمشق — دمر البلد، مقابل صالون الرفاعي",
  hours:    "يوميًا 10:00 ص — 10:00 م",
  delivery: "توصيل داخل دمشق · اطلب عبر واتساب",
  mapUrl:   "https://maps.app.goo.gl/Dkkwvj5cxcqtWPFL9",
  wheelUrl: "https://jamejame88.github.io/TREND/",
  sheetUrl: "https://script.google.com/macros/s/AKfycbx4zwX9C0PqPvE215aF1AwVs5j8pn7mqzbEx961qYShZDct3dYm4nTvetl8VBAtm9sA/exec"
};
/* ———————————————————— */

var $ = function(id){ return document.getElementById(id); };

$('vAddr').textContent  = CONFIG.address;
$('vHours').textContent = CONFIG.hours;
$('vDeliv').textContent = CONFIG.delivery;
$('mapBtn').href   = CONFIG.mapUrl;
$('callBtn').href  = 'tel:' + CONFIG.phone;
$('wheelBtn').href = CONFIG.wheelUrl;
$('waBtn').href    = 'https://wa.me/' + CONFIG.whatsapp +
  '?text=' + encodeURIComponent('مرحبا، بدي استفسر عن منتجاتكم');

function jsonp(params, ms){
  return new Promise(function(res){
    if (!CONFIG.sheetUrl) return res(null);
    var cb = 'cb_' + Date.now() + Math.floor(Math.random() * 9999);
    var s  = document.createElement('script');
    var done = false;
    function end(v){ if (done) return; done = true; clearTimeout(t); try{ delete window[cb]; }catch(e){} s.remove(); res(v); }
    var t = setTimeout(function(){ end(null); }, ms || 9000);
    window[cb] = end;
    s.onerror = function(){ end(null); };
    s.src = CONFIG.sheetUrl + '?callback=' + cb + '&' + params;
    document.body.appendChild(s);
  });
}

function el(tag, cls, txt){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
}

/* ——— العروض ——— */
jsonp('action=offers').then(function(r){
  if (!r || !r.offers || !r.offers.length) return;
  var box = $('offerList');
  r.offers.slice(0, 8).forEach(function(o){
    var row = el('div', 'offer');
    if (o.img){
      var im = new Image();
      im.src = o.img; im.alt = o.name || ''; im.loading = 'lazy'; im.decoding = 'async';
      im.onerror = function(){ im.remove(); };
      row.appendChild(im);
    }
    var b = el('div');
    b.style.flex = '1'; b.style.minWidth = '0';
    b.appendChild(el('div', 'o-name', o.name || ''));
    if (o.note) b.appendChild(el('div', 'o-note', o.note));
    if (o.priceNew || o.priceOld){
      var p = el('div', 'o-price');
      if (o.priceNew) p.appendChild(el('span', 'o-new', o.priceNew));
      if (o.priceOld) p.appendChild(el('span', 'o-old', o.priceOld));
      b.appendChild(p);
    }
    row.appendChild(b);
    box.appendChild(row);
  });
  $('offersSec').hidden = false;
});

/* ——— المنتجات ——— */
var ALL = [], CAT = 'الكل';

jsonp('action=products').then(function(r){
  ALL = (r && r.products) ? r.products : [];
  buildFilters();
  render();
});

function buildFilters(){
  var seen = {}, cats = ['الكل'];
  ALL.forEach(function(p){
    var c = (p.cat || '').trim();
    if (c && !seen[c]){ seen[c] = 1; cats.push(c); }
  });
  var f = $('filters');
  f.innerHTML = '';
  if (cats.length < 3) return;
  cats.forEach(function(c){
    var ch = el('div', 'chip' + (c === CAT ? ' on' : ''), c);
    ch.onclick = function(){
      CAT = c;
      [].forEach.call(f.children, function(x){ x.classList.remove('on'); });
      ch.classList.add('on');
      render();
    };
    f.appendChild(ch);
  });
}

function render(){
  var g = $('grid');
  g.innerHTML = '';
  var list = ALL.filter(function(p){ return CAT === 'الكل' || (p.cat || '').trim() === CAT; });

  if (!list.length){
    var e = el('div', 'empty', 'لسا ما في منتجات معروضة — تواصل معنا على واتساب.');
    e.style.gridColumn = '1 / -1';
    g.appendChild(e);
    return;
  }

  list.forEach(function(p){
    var card = el('div', 'prod');
    var th = el('div', 'thumb');
    if (p.img){
      var im = new Image();
      im.src = p.img; im.alt = p.name || ''; im.loading = 'lazy'; im.decoding = 'async';
      im.onerror = function(){ th.innerHTML = '<div class="noimg">◆</div>'; };
      th.appendChild(im);
    } else th.innerHTML = '<div class="noimg">◆</div>';
    card.appendChild(th);

    var b = el('div', 'pbody');
    b.appendChild(el('div', 'p-name', p.name || ''));
    if (p.cat)   b.appendChild(el('div', 'p-cat', p.cat));
    if (p.price) b.appendChild(el('div', 'p-price', p.price));

    var ask = el('a', 'p-ask', 'اسأل عنه');
    ask.href = 'https://wa.me/' + CONFIG.whatsapp + '?text=' +
      encodeURIComponent('مرحبا، بدي استفسر عن: ' + (p.name || ''));
    ask.target = '_blank'; ask.rel = 'noopener';
    ask.style.marginTop = 'auto';
    b.appendChild(ask);

    card.appendChild(b);
    g.appendChild(card);
  });
}
</script>
</body>
</html>
