<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TREND — هدايا وإكسسوار وعطور | دمر، دمشق</title>
<meta name="description" content="TREND (بيوتي غاليري سابقًا) — هدايا، إكسسوار، ألعاب، مكياج وعطور. دمشق، دمر البلد مقابل صالون الرفاعي. توصيل داخل دمشق.">
<meta name="theme-color" content="#100D0C">
<meta property="og:title" content="TREND — هدايا وإكسسوار وعطور">
<meta property="og:description" content="دمشق، دمر البلد — مقابل صالون الرفاعي. توصيل داخل دمشق.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&text=TREND&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#100D0C;--panel:#191413;--panel2:#221B19;
  --gold:#C6A44E;--gold-lt:#EBD9A8;--gold-dk:#8E7434;
  --line:rgba(198,164,78,.16);--line2:rgba(198,164,78,.34);
  --paper:#F3EEE7;--muted:#96897E;--wa:#25D366;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  background:var(--ink);color:var(--paper);
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif;
  font-weight:300;line-height:1.85;-webkit-font-smoothing:antialiased;
  padding-bottom:78px;
}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}

/* ——— الترويسة ——— */
header{
  text-align:center;padding:52px 18px 38px;
  background:radial-gradient(120% 80% at 50% 0%,#241C19,transparent 62%);
}
.wordmark{
  font-family:"Cormorant Garamond",Georgia,serif;font-weight:300;
  font-size:clamp(40px,13vw,56px);line-height:1;letter-spacing:.32em;
  direction:ltr;margin-right:-.32em;color:var(--gold-lt);
}
.former{font-size:14px;color:var(--muted);margin-top:8px;letter-spacing:.05em}
.tag{font-size:13px;color:var(--muted);margin-top:16px;letter-spacing:.03em}
.rule{width:120px;height:1px;margin:22px auto 0;
  background:linear-gradient(90deg,transparent,var(--line2),var(--gold),var(--line2),transparent)}

/* ——— أزرار سريعة ——— */
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:28px 0 8px}
.qbtn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--line2);padding:15px 10px;font-size:13.5px;
  letter-spacing:.04em;color:var(--gold-lt);transition:.2s;
}
.qbtn:hover{background:var(--panel2);border-color:var(--gold)}
.qbtn svg{width:17px;height:17px;fill:currentColor;flex:0 0 17px}

/* ——— الأقسام ——— */
section{margin-top:46px}
.h{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.h span:first-child,.h span:last-child{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line2))}
.h span:last-child{background:linear-gradient(90deg,var(--line2),transparent)}
.h b{font-size:11.5px;font-weight:400;letter-spacing:.26em;color:var(--gold);white-space:nowrap}

/* ——— العروض ——— */
.offer{
  display:flex;align-items:center;gap:14px;border:1px solid var(--line);
  background:linear-gradient(178deg,var(--panel2),var(--panel));
  padding:13px 15px;margin-bottom:10px;
}
.offer img{width:60px;height:60px;object-fit:cover;flex:0 0 60px;border:1px solid var(--line);background:#0E0B0A}
.o-name{font-size:14.5px;line-height:1.5}
.o-note{font-size:11.5px;color:var(--muted)}
.o-price{display:flex;gap:9px;align-items:baseline;margin-top:5px}
.o-new{font-size:16px;color:var(--gold-lt)}
.o-old{font-size:12.5px;color:var(--muted);text-decoration:line-through;opacity:.75}

/* ——— الفلاتر ——— */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1px solid var(--line2);color:var(--muted);
  padding:8px 16px;font-size:12.5px;letter-spacing:.04em;cursor:pointer;transition:.2s;
}
.chip.on{border-color:var(--gold);color:var(--ink);
  background:linear-gradient(120deg,var(--gold-dk),#E0CB92 45%,var(--gold))}

/* ——— المنتجات ——— */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.prod{
  border:1px solid var(--line);background:linear-gradient(178deg,var(--panel2),var(--panel));
  display:flex;flex-direction:column;overflow:hidden;transition:border-color .25s;
}
.prod:hover{border-color:var(--line2)}
.thumb{aspect-ratio:1/1;background:#0E0B0A;overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .55s cubic-bezier(.2,.7,.3,1)}
.prod:hover .thumb img{transform:scale(1.045)}
.noimg{display:flex;align-items:center;justify-content:center;height:100%;color:var(--line2);font-size:26px}
.badge{
  position:absolute;top:9px;right:9px;
  background:linear-gradient(120deg,var(--gold-dk),#E0CB92 50%,var(--gold));
  color:var(--ink);font-size:9.5px;font-weight:500;letter-spacing:.1em;padding:4px 9px;
}
.pbody{padding:12px 12px 12px;flex:1;display:flex;flex-direction:column}
.p-name{
  font-size:13px;line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;min-height:2.9em;
}
.p-price{font-size:15.5px;color:var(--gold-lt);margin-top:7px;letter-spacing:.01em}
.p-act{margin-top:11px}

.p-add{
  width:100%;height:38px;border:1px solid var(--line2);background:transparent;
  color:var(--gold-lt);font-family:inherit;font-size:11.5px;letter-spacing:.1em;
  cursor:pointer;transition:.22s;
}
.p-add:hover{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.p-ask{
  display:block;width:100%;height:38px;line-height:36px;border:1px solid var(--line2);
  text-align:center;font-size:11.5px;color:var(--muted);letter-spacing:.08em;transition:.22s;
}
.p-ask:hover{color:var(--gold-lt);border-color:var(--gold)}

.stepper{display:flex;height:38px;border:1px solid var(--gold);animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:.6}to{transform:none;opacity:1}}
.stepper button{
  flex:0 0 38px;background:transparent;border:0;color:var(--gold-lt);
  font-size:19px;line-height:1;cursor:pointer;padding:0;font-family:inherit;transition:.18s;
}
.stepper button:hover{background:rgba(198,164,78,.14)}
.stepper span{
  flex:1;display:flex;align-items:center;justify-content:center;
  font-size:14px;color:var(--gold-lt);background:rgba(198,164,78,.09);
}
.skel{height:210px;border:1px solid var(--line);background:var(--panel);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:.85}}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:26px 0}

/* ——— المعلومات ——— */
.info{border:1px solid var(--line);background:linear-gradient(178deg,var(--panel2),var(--panel));padding:22px 20px}
.irow{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.irow:last-child{border-bottom:0;padding-bottom:0}
.irow:first-child{padding-top:0}
.ik{flex:0 0 88px;font-size:11px;letter-spacing:.14em;color:var(--gold);padding-top:4px}
.iv{flex:1;font-size:13.5px;line-height:1.8}
.iv small{color:var(--muted);font-size:12px}

/* ——— دعوة ——— */
.cta{
  display:block;text-align:center;margin-top:14px;
  background:linear-gradient(120deg,var(--gold-dk),#E0CB92 42%,var(--gold) 62%,var(--gold-dk));
  color:var(--ink);padding:17px;font-size:12.5px;font-weight:500;letter-spacing:.18em;
}

footer{text-align:center;padding:44px 18px 26px;font-size:11.5px;color:var(--muted);letter-spacing:.05em}
.fr{width:40px;height:1px;margin:0 auto 16px;background:linear-gradient(90deg,transparent,var(--line2),transparent)}

/* ——— السلة ——— */
.p-add{
  margin-top:auto;border:1px solid var(--line2);text-align:center;cursor:pointer;
  padding:9px;font-size:11.5px;color:var(--gold-lt);letter-spacing:.06em;transition:.2s;
  background:transparent;font-family:inherit;width:100%;
}
.p-add:hover{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.p-add.added{background:var(--gold);color:var(--ink);border-color:var(--gold)}

.cartbar{
  position:fixed;bottom:0;left:0;right:0;z-index:22;display:none;
  background:linear-gradient(120deg,var(--gold-dk),#E0CB92 45%,var(--gold));
  color:var(--ink);box-shadow:0 -12px 34px -20px rgba(0,0,0,.95);
  animation:slideup .3s cubic-bezier(.2,.8,.3,1);
}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.cartbar.on{display:flex}
.cb-side{
  flex:1;display:flex;align-items:center;justify-content:center;gap:9px;
  padding:16px 12px;font-size:13px;font-weight:500;letter-spacing:.05em;cursor:pointer;
  border:0;background:transparent;font-family:inherit;color:inherit;
}
.cb-side:first-child{border-left:1px solid rgba(16,13,12,.2)}
.pill{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:21px;height:21px;padding:0 6px;border-radius:11px;
  background:rgba(16,13,12,.86);color:var(--gold-lt);font-size:11.5px;font-weight:500;
}

.sheet{
  position:fixed;inset:0;z-index:40;display:none;
  background:rgba(8,6,6,.72);align-items:flex-end;
}
.sheet.on{display:flex}
.sheet-in{
  width:100%;max-height:82vh;overflow-y:auto;background:var(--panel);
  border-top:1px solid var(--line2);padding:22px 18px 30px;
}
.sheet-in .wrapin{max-width:760px;margin:0 auto}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.sh-head b{font-size:12px;font-weight:400;letter-spacing:.22em;color:var(--gold)}
.sh-x{background:transparent;border:0;color:var(--muted);font-size:26px;cursor:pointer;line-height:1;padding:0 6px;width:auto}
.ci{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ci img{width:52px;height:52px;object-fit:cover;flex:0 0 52px;border:1px solid var(--line);background:#0E0B0A}
.ci-b{flex:1;min-width:0}
.ci-n{font-size:13.5px;line-height:1.5}
.ci-p{font-size:12.5px;color:var(--gold-lt);margin-top:2px}
.qty{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.qty button{
  width:30px;height:30px;padding:0;font-size:17px;line-height:1;
  background:transparent;border:1px solid var(--line2);color:var(--gold-lt);cursor:pointer;
}
.qty span{min-width:30px;text-align:center;font-size:14px}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:18px 0 6px;font-size:14px}
.tot b{font-size:19px;color:var(--gold-lt);font-weight:400}
.cart-empty{text-align:center;color:var(--muted);font-size:13px;padding:26px 0}

/* ——— واتساب ثابت ——— */
.wafab{
  position:fixed;bottom:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;justify-content:center;gap:9px;
  background:var(--wa);color:#08240F;padding:16px;
  font-size:13.5px;font-weight:500;letter-spacing:.06em;
  box-shadow:0 -10px 30px -18px rgba(0,0,0,.9);
}
.wafab svg{width:19px;height:19px;fill:currentColor}
</style>
</head>
<body>

<header>
  <div class="wordmark">TREND</div>
  <div class="former">بيوتي غاليري</div>
  <p class="tag">هدايا · إكسسوار · ألعاب · مكياج · عطور</p>
  <div class="rule"></div>
</header>

<div class="wrap">

  <nav class="quick">
    <a class="qbtn" id="mapBtn" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 00-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 00-7-7zm0 9.5A2.5 2.5 0 1112 6.5a2.5 2.5 0 010 5z"/></svg>
      الموقع على الخريطة
    </a>
    <a class="qbtn" id="callBtn">
      <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 006.6 6.6l2.2-2.2a1 1 0 011-.25 11 11 0 003.5.55 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.2.2 2.4.55 3.5a1 1 0 01-.25 1z"/></svg>
      اتصال
    </a>
  </nav>

  <section id="offersSec" hidden>
    <div class="h"><span></span><b>عروض اليوم</b><span></span></div>
    <div id="offerList"></div>
  </section>

  <section>
    <div class="h"><span></span><b>المنتجات</b><span></span></div>
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid">
      <div class="skel"></div><div class="skel"></div><div class="skel"></div>
      <div class="skel"></div><div class="skel"></div><div class="skel"></div>
    </div>
  </section>

  <section>
    <div class="h"><span></span><b>المحل</b><span></span></div>
    <div class="info">
      <div class="irow"><div class="ik">العنوان</div><div class="iv" id="vAddr"></div></div>
      <div class="irow"><div class="ik">الدوام</div><div class="iv" id="vHours"></div></div>
      <div class="irow"><div class="ik">التوصيل</div><div class="iv" id="vDeliv"></div></div>
    </div>
    <a class="cta" id="wheelBtn">جرّب حظك واربح حسم</a>
  </section>

</div>

<footer>
  <div class="fr"></div>
  TREND — دمشق، دمر البلد
</footer>

<div class="cartbar" id="cartBar">
  <button class="cb-side" id="openCart">
    <span class="pill" id="cbCount">0</span>
    <span id="cbTotal">السلة</span>
  </button>
  <button class="cb-side" id="sendOrder">إتمام الطلب</button>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-in">
    <div class="wrapin">
      <div class="sh-head">
        <b>سلة الطلب</b>
        <button class="sh-x" id="closeSheet" aria-label="إغلاق">×</button>
      </div>
      <div id="cartItems"></div>
      <div class="tot"><span>المجموع</span><b id="cartTotal">0</b></div>
      <a class="cta" id="sendOrder2">إرسال الطلب عبر واتساب</a>
    </div>
  </div>
</div>

<a class="wafab" id="waBtn" target="_blank" rel="noopener">
  <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 00-8.6 15L2 22l5.2-1.3A10 10 0 1012 2zm5.1 14.1c-.2.6-1.2 1.2-1.7 1.2-.4 0-1 .1-3.2-.8-2.7-1.1-4.4-3.9-4.6-4.1-.1-.2-1-1.4-1-2.6s.6-1.8.9-2.1c.2-.2.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.3.3c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.1 1 2 1.3 2.3 1.4.2.1.4.1.6-.1l.8-1c.2-.2.3-.2.5-.1l2 .9c.2.1.4.2.4.3.1.2.1.7-.1 1.3z"/></svg>
  تواصل على واتساب
</a>

<script>
/* ————— الإعدادات ————— */
var CONFIG = {
  whatsapp: "963934589893",
  phone:    "0934589893",
  address:  "دمشق — دمر البلد، مقابل صالون الرفاعي",
  hours:    "يوميًا 10:00 ص — 10:00 م",
  delivery: "توصيل داخل دمشق · اطلب عبر واتساب",
  mapUrl:   "https://maps.app.goo.gl/Dkkwvj5cxcqtWPFL9",
  wheelUrl: "https://jamejame88.github.io/TREND/",
  sheetUrl: "https://script.google.com/macros/s/AKfycbx4zwX9C0PqPvE215aF1AwVs5j8pn7mqzbEx961qYShZDct3dYm4nTvetl8VBAtm9sA/exec"
};
/* ———————————————————— */

var $ = function(id){ return document.getElementById(id); };

$('vAddr').textContent  = CONFIG.address;
$('vHours').textContent = CONFIG.hours;
$('vDeliv').textContent = CONFIG.delivery;
$('mapBtn').href   = CONFIG.mapUrl;
$('callBtn').href  = 'tel:' + CONFIG.phone;
$('wheelBtn').href = CONFIG.wheelUrl;
$('waBtn').href    = 'https://wa.me/' + CONFIG.whatsapp +
  '?text=' + encodeURIComponent('مرحبا، بدي استفسر عن منتجاتكم');

function jsonp(params, ms){
  return new Promise(function(res){
    if (!CONFIG.sheetUrl) return res(null);
    var cb = 'cb_' + Date.now() + Math.floor(Math.random() * 9999);
    var s  = document.createElement('script');
    var done = false;
    function end(v){ if (done) return; done = true; clearTimeout(t); try{ delete window[cb]; }catch(e){} s.remove(); res(v); }
    var t = setTimeout(function(){ end(null); }, ms || 9000);
    window[cb] = end;
    s.onerror = function(){ end(null); };
    s.src = CONFIG.sheetUrl + '?callback=' + cb + '&' + params;
    document.body.appendChild(s);
  });
}

function el(tag, cls, txt){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
}

/* حفظ محلي: يعرض آخر نسخة فورًا ثم يحدّث بالخلفية */
function memo(key){
  try { var v = localStorage.getItem('trend_' + key); return v ? JSON.parse(v) : null; }
  catch(e){ return null; }
}
function keep(key, val){
  try { localStorage.setItem('trend_' + key, JSON.stringify(val)); } catch(e){}
}

/* حالة السلة — لازم تتعرّف قبل رسم المنتجات */
var CART = memo('cart') || [];

/* ——— العروض ——— */
function paintOffers(list){
  if (!list || !list.length) return;
  var box = $('offerList');
  box.innerHTML = '';
  list.slice(0, 8).forEach(function(o){
    var row = el('div', 'offer');
    if (o.img){
      var im = new Image();
      im.src = o.img; im.alt = o.name || ''; im.loading = 'lazy'; im.decoding = 'async';
      im.onerror = function(){ im.remove(); };
      row.appendChild(im);
    }
    var b = el('div');
    b.style.flex = '1'; b.style.minWidth = '0';
    b.appendChild(el('div', 'o-name', o.name || ''));
    if (o.note) b.appendChild(el('div', 'o-note', o.note));
    if (o.priceNew || o.priceOld){
      var p = el('div', 'o-price');
      if (o.priceNew) p.appendChild(el('span', 'o-new', o.priceNew));
      if (o.priceOld) p.appendChild(el('span', 'o-old', o.priceOld));
      b.appendChild(p);
    }
    row.appendChild(b);
    box.appendChild(row);
  });
  $('offersSec').hidden = false;
}

paintOffers(memo('offers'));
jsonp('action=offers').then(function(r){
  if (r && r.offers){ keep('offers', r.offers); paintOffers(r.offers); }
});

/* ——— المنتجات ——— */
var ALL = [], CAT = 'الكل';

var cachedP = memo('products');
if (cachedP && cachedP.length){ ALL = cachedP; buildFilters(); render(); }

jsonp('action=products').then(function(r){
  if (r && r.products){
    keep('products', r.products);
    ALL = r.products;
  } else if (!ALL.length){
    ALL = [];
  }
  buildFilters();
  render();
});

function buildFilters(){
  var seen = {}, cats = ['الكل'];
  ALL.forEach(function(p){
    var c = (p.cat || '').trim();
    if (c && !seen[c]){ seen[c] = 1; cats.push(c); }
  });
  var f = $('filters');
  f.innerHTML = '';
  if (cats.length < 3) return;
  cats.forEach(function(c){
    var ch = el('div', 'chip' + (c === CAT ? ' on' : ''), c);
    ch.onclick = function(){
      CAT = c;
      [].forEach.call(f.children, function(x){ x.classList.remove('on'); });
      ch.classList.add('on');
      render();
    };
    f.appendChild(ch);
  });
}

var ACTIONS = [];

function paintAction(slot){
  var p = slot.p, q = qtyOf(p.name);
  slot.node.innerHTML = '';

  if (money(p.price) <= 0){
    var ask = el('a', 'p-ask', 'اسأل عنه');
    ask.href = 'https://wa.me/' + CONFIG.whatsapp + '?text=' +
      encodeURIComponent('مرحبا، بدي استفسر عن: ' + (p.name || ''));
    ask.target = '_blank'; ask.rel = 'noopener';
    slot.node.appendChild(ask);
    return;
  }

  if (q === 0){
    var add = el('button', 'p-add', 'أضف للسلة');
    add.onclick = function(){ addToCart(p); };
    slot.node.appendChild(add);
    return;
  }

  var st = el('div', 'stepper');
  var minus = el('button', null, q === 1 ? '×' : '−');
  minus.setAttribute('aria-label', 'إنقاص');
  minus.onclick = function(){ setQty(p.name, -1); };
  var plus = el('button', null, '+');
  plus.setAttribute('aria-label', 'زيادة');
  plus.onclick = function(){ setQty(p.name, 1); };
  st.appendChild(minus);
  st.appendChild(el('span', null, String(q)));
  st.appendChild(plus);
  slot.node.appendChild(st);
}

function paintAllActions(){
  ACTIONS.forEach(paintAction);
}

function render(){
  var g = $('grid');
  g.innerHTML = '';
  ACTIONS = [];
  var list = ALL.filter(function(p){ return CAT === 'الكل' || (p.cat || '').trim() === CAT; });

  if (!list.length){
    var e = el('div', 'empty', 'لسا ما في منتجات معروضة — تواصل معنا على واتساب.');
    e.style.gridColumn = '1 / -1';
    g.appendChild(e);
    return;
  }

  list.forEach(function(p){
    var card = el('div', 'prod');

    var th = el('div', 'thumb');
    if (p.img){
      var im = new Image();
      im.src = p.img; im.alt = p.name || ''; im.loading = 'lazy'; im.decoding = 'async';
      im.onerror = function(){ th.innerHTML = '<div class="noimg">◆</div>'; };
      th.appendChild(im);
    } else th.innerHTML = '<div class="noimg">◆</div>';
    if (p.note) th.appendChild(el('span', 'badge', p.note));
    card.appendChild(th);

    var b = el('div', 'pbody');
    b.appendChild(el('div', 'p-name', p.name || ''));
    if (money(p.price) > 0) b.appendChild(el('div', 'p-price', fmt(money(p.price))));

    var act = el('div', 'p-act');
    act.style.marginTop = 'auto';
    b.appendChild(act);
    ACTIONS.push({ p: p, node: act });

    card.appendChild(b);
    g.appendChild(card);
  });

  paintAllActions();
}

/* ————— السلة ————— */
function money(v){
  var d = String(v == null ? '' : v).replace(/[^\d]/g, '');
  return d ? parseInt(d, 10) : 0;
}
function fmt(n){
  return n.toLocaleString('en-US') + ' ل.س';
}

function addToCart(p){
  var i = -1;
  for (var k = 0; k < CART.length; k++) if (CART[k].name === p.name) i = k;
  if (i >= 0) CART[i].qty++;
  else CART.push({ name: p.name, price: money(p.price), img: p.img || '', qty: 1 });
  saveCart();
}
function setQty(name, d){
  for (var k = 0; k < CART.length; k++){
    if (CART[k].name === name){
      CART[k].qty += d;
      if (CART[k].qty < 1) CART.splice(k, 1);
      break;
    }
  }
  saveCart();
}
function cartTotal(){
  var t = 0;
  CART.forEach(function(c){ t += c.price * c.qty; });
  return t;
}
function cartCount(){
  var n = 0;
  CART.forEach(function(c){ n += c.qty; });
  return n;
}
function qtyOf(name){
  for (var k = 0; k < CART.length; k++) if (CART[k].name === name) return CART[k].qty;
  return 0;
}
function saveCart(){
  keep('cart', CART);
  paintCart();
  paintAllActions();
}

function paintCart(){
  var n = cartCount();
  $('cartBar').classList.toggle('on', n > 0);
  $('waBtn').style.display = n > 0 ? 'none' : 'flex';
  $('cbCount').textContent = String(n);
  $('cbTotal').textContent = fmt(cartTotal());
  $('cartTotal').textContent = fmt(cartTotal());
  if (!n) $('sheet').classList.remove('on');

  var box = $('cartItems');
  box.innerHTML = '';
  if (!CART.length){
    box.appendChild(el('div', 'cart-empty', 'السلة فاضية'));
    return;
  }
  CART.forEach(function(c){
    var row = el('div', 'ci');
    if (c.img){
      var im = new Image();
      im.src = c.img; im.alt = ''; im.loading = 'lazy';
      im.onerror = function(){ im.remove(); };
      row.appendChild(im);
    }
    var b = el('div', 'ci-b');
    b.appendChild(el('div', 'ci-n', c.name));
    b.appendChild(el('div', 'ci-p', fmt(c.price * c.qty)));
    row.appendChild(b);

    var q = el('div', 'qty');
    var minus = el('button', null, '−');
    minus.onclick = function(){ setQty(c.name, -1); };
    var plus = el('button', null, '+');
    plus.onclick = function(){ setQty(c.name, 1); };
    q.appendChild(minus);
    q.appendChild(el('span', null, String(c.qty)));
    q.appendChild(plus);
    row.appendChild(q);

    box.appendChild(row);
  });
}

function orderLink(){
  var lines = ['مرحبا، بدي أطلب من TREND:', ''];
  CART.forEach(function(c){
    lines.push('• ' + c.name + ' ×' + c.qty + ' — ' + fmt(c.price * c.qty));
  });
  lines.push('');
  lines.push('المجموع: ' + fmt(cartTotal()));
  lines.push('');
  lines.push('الاسم:');
  lines.push('العنوان للتوصيل:');
  return 'https://wa.me/' + CONFIG.whatsapp + '?text=' + encodeURIComponent(lines.join('\n'));
}

$('openCart').onclick   = function(){ $('sheet').classList.add('on'); };
$('closeSheet').onclick = function(){ $('sheet').classList.remove('on'); };
$('sheet').onclick      = function(e){ if (e.target === this) this.classList.remove('on'); };
$('sendOrder').onclick  = function(){ if (CART.length) window.open(orderLink(), '_blank'); };
$('sendOrder2').onclick = function(e){
  e.preventDefault();
  if (CART.length) window.open(orderLink(), '_blank');
};

paintCart();
</script>
