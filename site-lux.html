<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>(function(){try{if(localStorage.getItem('trend_theme')==='light'){document.documentElement.setAttribute('data-theme','light');}}catch(e){}})();</script>
<title>TREND — نسخة تجريبية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&text=TREND0123456789%D9%A0%D9%A1%D9%A2%D9%A3%D9%A4%D9%A5%D9%A6%D9%A7%D9%A8%D9%A9&display=swap" rel="stylesheet">
<style>
/* ═══ نظام الألوان ═══
   الليلي: أسود سبجي بلمسة دافئة + ذهب شمبانيا لامع
   النهاري: ألاباستر لؤلؤي + ذهب ساتان مطفي */
:root{
  --bg:#0B0B0A; --card:#141413; --card2:#1B1A18;
  --gold:#E6C687; --gold-mid:#D4AF37; --gold-dk:#8E7434;
  --txt:#F3EEE7; --muted:#8F877D;
  --line:rgba(212,175,55,.14); --line2:rgba(212,175,55,.32);
  --on-gold:#0A0A0A; --shadow:0 10px 40px rgba(0,0,0,.45);
  --wa:#0F3E24; --img-bg:#0E0B0A;
  --ease:cubic-bezier(.25,1,.5,1);
}
:root[data-theme="light"]{
  --bg:#FAF8F5; --card:#FFFFFF; --card2:#F5F1E9;
  --gold:#9A7B32; --gold-mid:#C5A059; --gold-dk:#7A5F26;
  --txt:#1A1A1A; --muted:#6E6459;
  --line:rgba(197,160,89,.18); --line2:rgba(197,160,89,.40);
  --on-gold:#FFFFFF; --shadow:0 10px 40px rgba(197,160,89,.10);
  --wa:#0F3E24; --img-bg:#EFEAE0;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  font-size:14px;line-height:1.7;padding-bottom:78px;
  transition:background .5s var(--ease),color .5s var(--ease);
}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}

/* ═══ الترويسة ═══ */
header{text-align:center;padding:46px 16px 30px}
.wordmark{
  font-family:"Cormorant Garamond",Georgia,serif;font-weight:300;
  font-size:clamp(42px,13vw,58px);line-height:1;letter-spacing:.34em;
  direction:ltr;margin-right:-.34em;
  background:linear-gradient(100deg,var(--gold-dk) 0%,var(--gold-mid) 24%,var(--gold) 42%,
    #FFF8E2 50%,var(--gold) 58%,var(--gold-mid) 76%,var(--gold-dk) 100%);
  background-size:260% 100%;background-position:80% 0;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  animation:markIn 1.1s var(--ease) both, shine 7s ease-in-out 1.2s infinite;
}
@keyframes markIn{from{opacity:0;transform:translateY(8px);letter-spacing:.5em}to{opacity:1;transform:none;letter-spacing:.34em}}
@keyframes shine{0%{background-position:80% 0}45%{background-position:20% 0}100%{background-position:80% 0}}
.former{font-size:13px;color:var(--muted);margin-top:11px;letter-spacing:.24em;animation:up .9s var(--ease) .25s both}
.rule{width:200px;height:14px;margin:20px auto 0;display:block;animation:up .9s var(--ease) .45s both}
.rule .ln{stroke:var(--gold-mid);stroke-width:.7;opacity:.45}
.rule .di{fill:none;stroke:var(--gold-mid);stroke-width:.8;opacity:.7}
.rule .co{fill:var(--gold-mid)}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ═══ زر تبديل النمط ═══ */
.tgl{
  position:fixed;top:14px;left:14px;z-index:30;width:38px;height:38px;border-radius:50%;
  border:.5px solid var(--line2);background:var(--card);color:var(--gold);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:all .5s var(--ease);
}
.tgl:hover{border-color:var(--gold);transform:rotate(18deg)}
.tgl svg{width:17px;height:17px;fill:currentColor}

/* ═══ الأزرار السريعة (اتصال / موقع) ═══ */
.quick{display:grid;gap:9px;margin:26px 0 6px}
.qbtn{
  display:flex;align-items:center;gap:11px;padding:14px 16px;
  border:.5px solid var(--line2);border-radius:6px;background:var(--card);
  color:var(--txt);text-decoration:none;font-size:13px;letter-spacing:.05em;
  transition:all .5s var(--ease);
}
.qbtn:hover{border-color:var(--gold);transform:translateY(-1px);box-shadow:var(--shadow)}
.qico{
  width:32px;height:32px;border-radius:50%;flex:0 0 32px;
  background:linear-gradient(135deg,var(--gold-dk),var(--gold-mid));
  display:flex;align-items:center;justify-content:center;color:var(--on-gold);
}
.qico svg{width:15px;height:15px;fill:currentColor}

/* ═══ عنوان القسم ═══ */
.h{display:flex;align-items:center;gap:14px;margin:34px 0 18px}
.h span{flex:1;height:.5px;background:var(--line2)}
.h b{font-weight:400;font-size:11.5px;letter-spacing:.26em;color:var(--gold)}

/* ═══ أزرار التصنيف (Ghost) ═══ */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{
  position:relative;overflow:hidden;padding:9px 18px;border-radius:6px;
  border:.5px solid var(--line2);background:transparent;color:var(--gold);
  font:inherit;font-size:12.5px;letter-spacing:.07em;cursor:pointer;
  transition:all .5s var(--ease);
}
.chip::before{
  content:"";position:absolute;inset:0;background:var(--gold);
  transform:scaleX(0);transform-origin:right;transition:transform .5s var(--ease);
}
.chip span{position:relative;z-index:1}
.chip:hover::before,.chip.on::before{transform:scaleX(1)}
.chip:hover,.chip.on{color:var(--on-gold);border-color:var(--gold)}

/* ═══ شبكة المنتجات ═══ */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.prod{
  background:var(--card);border:.5px solid var(--line);border-radius:8px;overflow:hidden;
  transition:all .5s var(--ease);
}
.prod::before{content:"";display:block;height:1px;background:linear-gradient(to left,var(--line2),transparent)}
.prod:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:var(--shadow)}
.prod.out{opacity:.5}
.thumb{position:relative;aspect-ratio:1;background:var(--img-bg);display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease)}
.prod:hover .thumb img{transform:scale(1.05)}
.noimg{color:var(--line2);font-size:26px}
.badge{
  position:absolute;top:8px;inset-inline-start:8px;padding:3px 9px;border-radius:4px;
  background:var(--gold);color:var(--on-gold);font-size:9.5px;letter-spacing:.1em;
}
.badge.out{background:#7A2A2A;color:#fff}
.pbody{padding:12px 12px 14px}
.p-name{font-size:12.5px;line-height:1.6;margin-bottom:6px;min-height:2.4em}
.p-price{font-family:"Cormorant Garamond",Georgia,serif;font-size:19px;color:var(--gold)}
.p-price small{font-family:inherit;font-size:10px;color:var(--muted);letter-spacing:.08em}
.addbtn{
  width:100%;margin-top:10px;padding:9px;border-radius:6px;border:.5px solid var(--line2);
  background:transparent;color:var(--gold);font:inherit;font-size:11.5px;letter-spacing:.08em;
  cursor:pointer;transition:all .5s var(--ease);
}
.addbtn:hover{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.qty{display:flex;align-items:center;gap:10px;margin-top:10px;justify-content:center}
.qty button{
  width:28px;height:28px;border-radius:6px;border:.5px solid var(--line2);
  background:transparent;color:var(--gold);font:inherit;cursor:pointer;
  transition:all .5s var(--ease);
}
.qty button:hover{background:var(--gold);color:var(--on-gold)}
.qty b{font-weight:400;min-width:18px;text-align:center;font-size:13px}

/* ═══ شريط الطلب السفلي ═══ */
.wabar{
  position:fixed;bottom:0;inset-inline:0;z-index:40;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 18px;background:var(--wa);
  border-top:.5px solid var(--line2);cursor:pointer;
  transform:translateY(105%);transition:transform .5s var(--ease);
}
.wabar.on{transform:none}
.wabar .sum{color:var(--gold);font-size:12.5px;letter-spacing:.05em}
.wabar .go{
  position:relative;overflow:hidden;color:#fff;font-size:12.5px;letter-spacing:.1em;
  padding:8px 16px;border-radius:6px;border:.5px solid rgba(230,198,135,.35);
}
.wabar:hover .go::after{animation:sheen .9s ease-out}
.wabar .go::after{
  content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);
}
@keyframes sheen{to{left:130%}}

/* ═══ نافذة السلة ═══ */
.ovl{
  position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);
  display:none;align-items:flex-end;justify-content:center;
}
.ovl.on{display:flex}
.sheet{
  width:100%;max-width:520px;max-height:82vh;overflow-y:auto;
  background:var(--card);border-radius:12px 12px 0 0;
  border-top:.5px solid var(--line2);padding:22px 18px 26px;
  animation:slide .45s var(--ease) both;
}
@keyframes slide{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.crow{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:.5px solid var(--line)}
.crow:first-of-type{border-top:0}
.crow .nm{flex:1;font-size:12.5px}
.crow .pr{font-family:"Cormorant Garamond",Georgia,serif;font-size:16px;color:var(--gold)}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 14px;padding-top:14px;border-top:.5px solid var(--line2)}
.total b{font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;color:var(--gold);font-weight:400}
.btn-gold{
  position:relative;overflow:hidden;display:block;width:100%;padding:15px;border:0;border-radius:6px;
  background:var(--gold-mid);color:var(--on-gold);font:inherit;font-size:13px;letter-spacing:.12em;
  cursor:pointer;transition:all .5s var(--ease);
}
.btn-gold::after{
  content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);
}
.btn-gold:hover::after{animation:sheen .9s ease-out}
.btn-gold:hover{transform:translateY(-1px)}
.btn-ghost{
  display:block;width:100%;margin-top:9px;padding:12px;border-radius:6px;
  border:.5px solid var(--line2);background:transparent;color:var(--muted);
  font:inherit;font-size:12px;cursor:pointer;transition:all .5s var(--ease);
}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.empty{color:var(--muted);font-size:12.5px;text-align:center;padding:26px 0}
footer{text-align:center;color:var(--muted);font-size:11px;letter-spacing:.1em;padding:36px 0 20px}
.note-demo{
  margin:14px 0 0;padding:10px 12px;border:.5px dashed var(--line2);border-radius:6px;
  color:var(--muted);font-size:11.5px;text-align:center;
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<button class="tgl" id="tgl" aria-label="تبديل النمط">
  <svg id="ico" viewBox="0 0 24 24"><path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36A5.39 5.39 0 0112 3z"/></svg>
</button>

<header>
  <div class="wordmark">TREND</div>
  <div class="former">بيوتي غاليري</div>
  <svg class="rule" viewBox="0 0 200 14" aria-hidden="true">
    <line class="ln" x1="0" y1="7" x2="62" y2="7"/>
    <line class="ln" x1="138" y1="7" x2="200" y2="7"/>
    <rect class="di" x="68" y="4" width="6" height="6" transform="rotate(45 71 7)"/>
    <rect class="co" x="94" y="1" width="12" height="12" transform="rotate(45 100 7)"/>
    <rect class="di" x="126" y="4" width="6" height="6" transform="rotate(45 129 7)"/>
  </svg>
</header>

<div class="wrap">
  <nav class="quick">
    <a class="qbtn" id="callBtn">
      <span class="qico"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 006.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 013 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1l-2.3 2.2z"/></svg></span>
      اتصال
    </a>
    <a class="qbtn" id="mapBtn">
      <span class="qico"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 00-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 00-7-7zm0 9.5A2.5 2.5 0 1112 6a2.5 2.5 0 010 5.5z"/></svg></span>
      الموقع
    </a>
  </nav>

  <div class="note-demo">نسخة تجريبية للشكل — الواجهة الأمامية فقط. نادي ترند والنقاط وعجلة الحظ مو موجودين هون.</div>

  <div class="h"><span></span><b>المنتجات</b><span></span></div>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"><div class="empty" style="grid-column:1/-1">جارٍ التحميل…</div></div>

  <footer>TREND · بيوتي غاليري · دمشق — دمّر البلد</footer>
</div>

<div class="wabar" id="wabar">
  <span class="sum" id="waSum"></span>
  <span class="go">إتمام الطلب ←</span>
</div>

<div class="ovl" id="ovl">
  <div class="sheet">
    <div class="h" style="margin-top:0"><span></span><b>سلة الطلب</b><span></span></div>
    <div id="cartList"></div>
    <div class="total"><span style="font-size:12px;letter-spacing:.16em;color:var(--muted)">الإجمالي</span><b id="cartTotal">0</b></div>
    <button class="btn-gold" id="sendBtn">أرسل الطلب على واتساب</button>
    <button class="btn-ghost" id="closeBtn">متابعة التسوّق</button>
  </div>
</div>

<script>
/* ═══════ الإعدادات ═══════ */
var CONFIG = {
  whatsapp:"963934589893",
  phone:"0934589893",
  mapUrl:"https://maps.app.goo.gl/Dkkwvj5cxcqtWPFL9",
  sheetUrl:"https://script.google.com/macros/s/AKfycbx4zwX9C0PqPvE215aF1AwVs5j8pn7mqzbEx961qYShZDct3dYm4nTvetl8VBAtm9sA/exec"
};
var $ = function(id){ return document.getElementById(id); };
var el = function(t,c,x){ var n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n; };

/* ═══════ تبديل النمط ═══════ */
(function(){
  var root=document.documentElement, b=$('tgl');
  function paint(){
    var light = root.getAttribute('data-theme')==='light';
    $('ico').innerHTML = light
      ? '<path d="M12 17a5 5 0 100-10 5 5 0 000 10zm0-13V2m0 20v-2m8-8h2M2 12h2m13.7-5.7l1.4-1.4M4.9 19.1l1.4-1.4m11.4 0l1.4 1.4M4.9 4.9l1.4 1.4"stroke="currentColor"stroke-width="1.6"fill="none"stroke-linecap="round"/>'
      : '<path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36A5.39 5.39 0 0112 3z"/>';
  }
  b.onclick=function(){
    var light = root.getAttribute('data-theme')==='light';
    if(light) root.removeAttribute('data-theme'); else root.setAttribute('data-theme','light');
    try{ localStorage.setItem('trend_theme', light?'dark':'light'); }catch(e){}
    paint();
  };
  paint();
})();

$('callBtn').href = 'tel:'+CONFIG.phone;
$('mapBtn').href  = CONFIG.mapUrl;
$('mapBtn').target= '_blank';

/* ═══════ جلب المنتجات (نفس مصدر الموقع الحالي) ═══════ */
function jsonp(params, ms){
  return new Promise(function(res){
    var cb='cb_'+Date.now()+Math.floor(Math.random()*9999);
    var s=document.createElement('script'), done=false;
    function end(v){ if(done)return; done=true; clearTimeout(t); try{delete window[cb];}catch(e){} s.remove(); res(v); }
    var t=setTimeout(function(){ end(null); }, ms||12000);
    window[cb]=end; s.onerror=function(){ end(null); };
    s.src=CONFIG.sheetUrl+'?callback='+cb+'&'+params;
    document.body.appendChild(s);
  });
}

var ALL=[], CAT='الكل', SET={rate:0}, CART={};

function money(n,cur){
  var rate=Number(SET&&SET.rate)||0;
  var v=(cur==='usd'&&rate>0)?n*rate:n;
  v=Number(v)||0;
  return v>0 ? Math.round(v).toLocaleString('en-US') : 0;
}

jsonp('action=all',12000).then(function(r){
  if(r&&r.set) SET=r.set;
  ALL=(r&&r.products)?r.products:[];
  buildFilters(); render();
});

function buildFilters(){
  var seen={}, cats=['الكل'];
  ALL.forEach(function(p){
    var c=(p.cat||'').trim();
    if(c==='كبار العملاء') return;
    if(c&&!seen[c]){ seen[c]=1; cats.push(c); }
  });
  var f=$('filters'); f.innerHTML='';
  cats.forEach(function(c){
    var b=el('button','chip'+(c===CAT?' on':''));
    b.appendChild(el('span',null,c));
    b.onclick=function(){ CAT=c; buildFilters(); render(); };
    f.appendChild(b);
  });
}

function render(){
  var g=$('grid'); g.innerHTML='';
  var list=ALL.filter(function(p){
    var c=(p.cat||'').trim();
    if(c==='كبار العملاء') return false;
    return CAT==='الكل'||c===CAT;
  });
  if(!list.length){
    var e=el('div','empty','ما في منتجات بهالقسم');
    e.style.gridColumn='1/-1'; g.appendChild(e); return;
  }
  list.forEach(function(p,i){
    var out=(p.avail===false);
    var card=el('div','prod'+(out?' out':''));
    var th=el('div','thumb');
    var imgs=(p.imgs&&p.imgs.length)?p.imgs:(p.img?[p.img]:[]);
    if(imgs.length){
      var im=new Image();
      im.src=imgs[0]; im.alt=p.name||''; im.loading='lazy'; im.decoding='async';
      im.onerror=function(){ th.innerHTML='<div class="noimg">◆</div>'; };
      th.appendChild(im);
    } else th.innerHTML='<div class="noimg">◆</div>';
    if(out) th.appendChild(el('span','badge out','نفد'));
    else if(p.note) th.appendChild(el('span','badge',p.note));
    card.appendChild(th);

    var b=el('div','pbody');
    b.appendChild(el('div','p-name',p.name||''));
    var pr=el('div','p-price',money(p.price,p.cur));
    pr.appendChild(el('small',null,' ل.س'));
    b.appendChild(pr);

    if(!out){
      var key=(p.name||'')+'|'+i;
      var n=CART[key]?CART[key].n:0;
      if(n>0){
        var q=el('div','qty');
        var minus=el('button',null,'−'); minus.onclick=function(){ chg(key,p,-1); };
        var plus=el('button',null,'+'); plus.onclick=function(){ chg(key,p,1); };
        q.appendChild(minus); q.appendChild(el('b',null,String(n))); q.appendChild(plus);
        b.appendChild(q);
      } else {
        var add=el('button','addbtn','أضف للسلة');
        add.onclick=function(){ chg(key,p,1); };
        b.appendChild(add);
      }
    }
    card.appendChild(b);
    g.appendChild(card);
  });
}

function chg(key,p,d){
  if(!CART[key]) CART[key]={n:0,name:p.name,price:Number(money(p.price,p.cur).toString().replace(/,/g,''))||0};
  CART[key].n+=d;
  if(CART[key].n<=0) delete CART[key];
  render(); paintCart();
}

function cartTotal(){
  var t=0; Object.keys(CART).forEach(function(k){ t+=CART[k].n*CART[k].price; }); return t;
}
function cartCount(){
  var c=0; Object.keys(CART).forEach(function(k){ c+=CART[k].n; }); return c;
}

function paintCart(){
  var c=cartCount();
  $('wabar').classList.toggle('on', c>0);
  $('waSum').textContent = c+' قطعة · '+cartTotal().toLocaleString('en-US')+' ل.س';
  var list=$('cartList'); list.innerHTML='';
  Object.keys(CART).forEach(function(k){
    var it=CART[k];
    var row=el('div','crow');
    row.appendChild(el('span','nm',it.name+' × '+it.n));
    row.appendChild(el('span','pr',(it.n*it.price).toLocaleString('en-US')));
    list.appendChild(row);
  });
  if(!c) list.appendChild(el('div','empty','السلة فاضية'));
  $('cartTotal').textContent = cartTotal().toLocaleString('en-US');
}

$('wabar').onclick=function(){ $('ovl').classList.add('on'); };
$('closeBtn').onclick=function(){ $('ovl').classList.remove('on'); };
$('ovl').onclick=function(e){ if(e.target===this) this.classList.remove('on'); };

$('sendBtn').onclick=function(){
  if(!cartCount()) return;
  var lines=['*طلب من موقع TREND*',''];
  Object.keys(CART).forEach(function(k){
    var it=CART[k];
    lines.push(it.name+' × '+it.n+' = '+(it.n*it.price).toLocaleString('en-US'));
  });
  lines.push('');
  lines.push('*الإجمالي: '+cartTotal().toLocaleString('en-US')+' ل.س*');
  window.open('https://wa.me/'+CONFIG.whatsapp+'?text='+encodeURIComponent(lines.join('\n')),'_blank');
};

paintCart();
</script>
