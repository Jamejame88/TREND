<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>TREND — إرسال رسائل واتساب</title>
<style>
:root{
  --ink:#0B0B0A;--panel:#141413;--panel2:#1B1A18;
  --gold:#D4AF37;--gold-lt:#E6C687;--gold-dk:#8E7434;
  --line:rgba(212,175,55,.14);--line2:rgba(212,175,55,.32);
  --paper:#F3EEE7;--muted:#8F877D;--wa:#128C4A;
  --ok:#8FD37D;--warn:#E8A33D;--bad:#D98C8C;--on-gold:#0A0A0A;
  --r:10px;--r-sm:7px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--ink);color:var(--paper);
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif;
  font-weight:300;line-height:1.8;-webkit-font-smoothing:antialiased;padding-bottom:40px;
}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
header{text-align:center;padding:30px 16px 20px}
header h1{font-size:17px;font-weight:400;letter-spacing:.18em;color:var(--gold)}
header p{font-size:12px;color:var(--muted);margin-top:6px}
.card{
  border:1px solid var(--line);border-radius:var(--r);
  background:linear-gradient(178deg,var(--panel2),var(--panel));
  padding:18px 16px;margin-bottom:14px;
}
label{display:block;font-size:11px;letter-spacing:.14em;color:var(--gold);margin-bottom:7px}
input,textarea,select{
  width:100%;padding:11px 12px;background:var(--panel);
  border:1px solid var(--line2);border-radius:var(--r-sm);
  color:var(--paper);font:inherit;font-size:13.5px;
}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold)}
textarea{min-height:120px;resize:vertical;line-height:1.9}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 18px;border:0;border-radius:var(--r-sm);cursor:pointer;
  font:inherit;font-size:13px;letter-spacing:.06em;
  background:linear-gradient(120deg,var(--gold-dk),#E0CB92 45%,var(--gold));color:var(--on-gold);
}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--gold-lt)}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.hint{font-size:11.5px;color:var(--muted);line-height:1.75;margin-top:8px}
.msg{font-size:12.5px;margin-top:10px;min-height:16px}
/* عدّاد اليوم */
.meter{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.meter b{font-size:26px;color:var(--gold);font-weight:400}
.bar{flex:1;min-width:140px;height:6px;border-radius:3px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-dk),var(--gold));transition:width .4s}
.bar.warn i{background:linear-gradient(90deg,#B07C25,var(--warn))}
.bar.stop i{background:linear-gradient(90deg,#8E3A3A,var(--bad))}
.note{
  border-radius:var(--r-sm);padding:11px 13px;font-size:12px;line-height:1.8;margin-top:10px;
  border:1px solid var(--line2);background:rgba(198,164,78,.06);color:var(--muted);
}
.note.warn{border-color:rgba(232,163,61,.45);background:rgba(232,163,61,.09);color:var(--warn)}
.note.stop{border-color:rgba(217,140,140,.45);background:rgba(217,140,140,.09);color:var(--bad)}
/* الفلاتر */
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1px solid var(--line2);border-radius:var(--r-sm);
  color:var(--gold-lt);padding:8px 14px;font-size:12px;cursor:pointer;
  background:transparent;font-family:inherit;transition:.2s;
}
.chip.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
/* القائمة */
.person{
  display:flex;gap:11px;align-items:center;padding:12px 0;
  border-bottom:1px solid var(--line);
}
.person:last-child{border-bottom:0}
.pb{flex:1;min-width:0}
.pn{font-size:14px;line-height:1.5}
.pm{font-size:11.5px;color:var(--muted);margin-top:2px}
.tag{
  display:inline-block;padding:1px 7px;border-radius:9px;font-size:9.5px;
  letter-spacing:.06em;margin-inline-start:6px;vertical-align:middle;
  border:1px solid var(--line2);color:var(--gold-lt);
}
.tag.used{border-color:rgba(143,211,125,.4);color:var(--ok)}
.tag.sent{border-color:rgba(143,211,125,.4);color:var(--ok)}
.wa{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
  padding:10px 14px;border-radius:var(--r-sm);border:0;cursor:pointer;
  background:var(--wa);color:#fff;font:inherit;font-size:12px;text-decoration:none;
}
.wa.done{background:transparent;border:1px solid var(--line2);color:var(--muted)}
.wa svg{width:15px;height:15px;fill:currentColor}
.undo{
  flex:0 0 auto;background:transparent;border:0;color:var(--muted);
  font:inherit;font-size:16px;cursor:pointer;padding:6px;
}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:26px 0}
.count{font-size:11.5px;color:var(--muted);margin-bottom:10px}
</style>
</head>
<body>

<header>
  <h1>TREND — إرسال رسائل واتساب</h1>
  <p>صفحة خاصة لصاحب المحل · أرقام الزباين من عجلة الحظ</p>
</header>

<div class="wrap">

  <!-- ① الدخول -->
  <div class="card" id="loginCard">
    <label>رمز الدخول</label>
    <input type="password" id="pin" placeholder="نفس رمز لوحة إدارة الموقع" autocomplete="off">
    <div class="row" style="margin-top:11px">
      <button class="btn" id="loginBtn" type="button">دخول وتحميل الأرقام</button>
    </div>
    <div class="msg" id="loginMsg"></div>
  </div>

  <!-- ② نص الرسالة -->
  <div class="card" id="msgCard" hidden>
    <label>نص الرسالة</label>
    <textarea id="tpl"></textarea>
    <div class="hint">
      اكتب <b>{الاسم}</b> بأي مكان وبينستبدل تلقائيًا باسم الزبون.
      النص بينحفظ بالجهاز، فما بتحتاج تعيد كتابته كل مرة.
    </div>
    <div class="row" style="margin-top:11px">
      <button class="btn ghost" id="previewBtn" type="button">معاينة</button>
      <button class="btn ghost" id="resetTpl" type="button">رجّع النص الافتراضي</button>
    </div>
    <div class="note" id="preview" hidden></div>
  </div>

  <!-- ③ عدّاد اليوم -->
  <div class="card" id="meterCard" hidden>
    <label>المرسَل اليوم</label>
    <div class="meter">
      <b id="todayNum">0</b>
      <div class="bar" id="bar"><i id="barFill"></i></div>
      <span class="hint" style="margin:0">الحد الآمن <span id="capTxt">25</span> رسالة/يوم</span>
    </div>
    <div class="note" id="capNote"></div>
  </div>

  <!-- ④ القائمة -->
  <div class="card" id="listCard" hidden>
    <label>الأرقام</label>
    <input type="search" id="q" placeholder="بحث بالاسم أو الرقم" autocomplete="off" style="margin-bottom:10px">
    <div class="chips">
      <button class="chip on" data-f="todo" type="button">ما انبعتلهم</button>
      <button class="chip" data-f="all" type="button">الكل</button>
      <button class="chip" data-f="sent" type="button">انبعتلهم</button>
      <button class="chip" data-f="unused" type="button">كودهم غير مستخدم</button>
      <button class="chip" data-f="used" type="button">زاروا المحل</button>
    </div>
    <div class="count" id="count"></div>
    <div id="list"></div>
  </div>

</div>

<script>
/* ═══ الإعدادات ═══ */
var SHEET_URL = 'https://script.google.com/macros/s/AKfycbx4zwX9C0PqPvE215aF1AwVs5j8pn7mqzbEx961qYShZDct3dYm4nTvetl8VBAtm9sA/exec';
var DAILY_CAP  = 25;   /* الحد الآمن - فوقه في خطر حظر رقم المحل من واتساب */
var DAILY_STOP = 35;   /* فوق هاد منوقف الأزرار */

var DEFAULT_TPL =
  'مرحبا {الاسم} 🌿\n' +
  'معك TREND — دمر البلد.\n' +
  'عم نفتتح فرعنا الجديد، وحبينا تكون من أول الناس يلي بيعرفوا.\n' +
  'الافتتاح: [اكتب التاريخ هون]\n' +
  'بانتظارك 🎁';

var PIN_KEY  = 'trend_send_pin';
var TPL_KEY  = 'trend_send_tpl';
var SENT_KEY = 'trend_send_log';   /* { "963...": "2026-10-11" } */

var $ = function(id){ return document.getElementById(id); };
var ROWS = [], FILTER = 'todo';

/* ═══ تخزين محلي آمن ═══ */
function lsGet(k, d){ try { var v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
function sentLog(){
  try { return JSON.parse(localStorage.getItem(SENT_KEY) || '{}'); } catch(e){ return {}; }
}
function saveLog(o){ try { localStorage.setItem(SENT_KEY, JSON.stringify(o)); } catch(e){} }
function today(){
  var d = new Date();
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}

/* ═══ الاتصال بـApps Script ═══ */
function jsonp(params, ms){
  return new Promise(function(res){
    var cb = 'cb_' + Date.now() + Math.floor(Math.random() * 9999);
    var s = document.createElement('script');
    var done = false;
    function end(v){
      if (done) return;
      done = true; clearTimeout(t);
      window[cb] = function(){};
      s.remove(); res(v);
    }
    var t = setTimeout(function(){ end(null); }, ms || 30000);
    window[cb] = end;
    s.onerror = function(){ end(null); };
    s.src = SHEET_URL + '?callback=' + cb + '&' + params;
    document.body.appendChild(s);
  });
}

/* ═══ الأرقام ═══
   أرقام سوريا: 09XXXXXXXX محليًا → 9639XXXXXXXX لواتساب */
function waPhone(raw){
  var p = String(raw || '').replace(/\D/g, '');
  if (!p) return '';
  if (p.indexOf('00963') === 0) p = p.slice(2);
  if (p.indexOf('963') === 0) return p;
  if (p.indexOf('0') === 0) return '963' + p.slice(1);
  if (p.length === 9 && p.indexOf('9') === 0) return '963' + p;
  return p;
}
function prettyPhone(raw){
  var p = String(raw || '').replace(/\D/g, '');
  if (p.indexOf('963') === 0) p = '0' + p.slice(3);
  return p;
}

/* ═══ الدخول ═══ */
function login(){
  var pin = $('pin').value.trim();
  if (!pin){ $('loginMsg').style.color = 'var(--bad)'; $('loginMsg').textContent = 'اكتب رمز الدخول'; return; }
  $('loginBtn').disabled = true;
  $('loginMsg').style.color = '';
  $('loginMsg').textContent = 'عم نحمّل الأرقام… ممكن ياخد لحظات';

  jsonp('action=contacts&pin=' + encodeURIComponent(pin), 45000).then(function(r){
    $('loginBtn').disabled = false;
    if (!r){
      $('loginMsg').style.color = 'var(--bad)';
      $('loginMsg').textContent = 'ما وصل رد — تأكد من النت وجرّب مرة تانية';
      return;
    }
    if (!r.ok){
      $('loginMsg').style.color = 'var(--bad)';
      $('loginMsg').textContent = r.message || 'رمز الدخول غلط';
      return;
    }
    lsSet(PIN_KEY, pin);
    ROWS = r.rows || [];
    $('loginMsg').style.color = 'var(--ok)';
    $('loginMsg').textContent = '✓ تم تحميل ' + ROWS.length + ' رقم';
    $('msgCard').hidden = false;
    $('meterCard').hidden = false;
    $('listCard').hidden = false;
    paintMeter();
    render();
  });
}
$('loginBtn').onclick = login;
$('pin').addEventListener('keydown', function(e){ if (e.key === 'Enter') login(); });

/* رمز محفوظ من قبل؟ منعبيه ومنحمّل لحالنا */
(function auto(){
  var saved = lsGet(PIN_KEY, '');
  if (saved){ $('pin').value = saved; login(); }
})();

/* ═══ نص الرسالة ═══ */
$('tpl').value = lsGet(TPL_KEY, DEFAULT_TPL);
$('tpl').addEventListener('input', function(){ lsSet(TPL_KEY, $('tpl').value); });
$('resetTpl').onclick = function(){
  $('tpl').value = DEFAULT_TPL;
  lsSet(TPL_KEY, DEFAULT_TPL);
};
$('previewBtn').onclick = function(){
  var p = $('preview');
  var name = (ROWS[0] && ROWS[0].name) ? ROWS[0].name : 'أحمد';
  p.hidden = false;
  p.textContent = buildMsg(name);
};
function buildMsg(name){
  return $('tpl').value.replace(/\{الاسم\}/g, name || 'صديقنا');
}

/* ═══ عدّاد اليوم ═══ */
function sentToday(){
  var log = sentLog(), t = today(), n = 0;
  for (var k in log) if (log[k] === t) n++;
  return n;
}
function paintMeter(){
  var n = sentToday();
  $('todayNum').textContent = String(n);
  $('capTxt').textContent = String(DAILY_CAP);
  var bar = $('bar'), note = $('capNote');
  $('barFill').style.width = Math.min(100, (n / DAILY_STOP) * 100) + '%';
  bar.className = 'bar' + (n >= DAILY_STOP ? ' stop' : (n >= DAILY_CAP ? ' warn' : ''));
  if (n >= DAILY_STOP){
    note.className = 'note stop';
    note.innerHTML = '🛑 <b>وقّف اليوم.</b> بعتت ' + n + ' رسالة — واتساب ممكن يحظر رقم المحل إذا كمّلت. كمّل بكرة.';
  } else if (n >= DAILY_CAP){
    note.className = 'note warn';
    note.innerHTML = '⚠ وصلت الحد الآمن. الأفضل توقف اليوم وتكمّل بكرة، حتى ما ينحظر رقم المحل.';
  } else {
    note.className = 'note';
    note.innerHTML = 'ابعت على مهلك — رسالة كل دقيقة تقريبًا، ووقّف عند ' + DAILY_CAP +
      '. الإرسال السريع لأرقام ما بتعرفك هو السبب الأول لحظر الأرقام بواتساب.';
  }
}

/* ═══ الفلاتر ═══ */
[].forEach.call(document.querySelectorAll('.chip'), function(c){
  c.onclick = function(){
    [].forEach.call(document.querySelectorAll('.chip'), function(x){ x.classList.remove('on'); });
    c.classList.add('on');
    FILTER = c.getAttribute('data-f');
    render();
  };
});
$('q').addEventListener('input', render);

/* ═══ القائمة ═══ */
function render(){
  var log = sentLog();
  var q = $('q').value.trim().replace(/\s+/g, ' ');
  var qd = q.replace(/\D/g, '');

  var list = ROWS.filter(function(p){
    var isSent = !!log[p.phone];
    if (FILTER === 'todo'   && isSent) return false;
    if (FILTER === 'sent'   && !isSent) return false;
    if (FILTER === 'unused' && p.used) return false;
    if (FILTER === 'used'   && !p.used) return false;
    if (q){
      var okName = (p.name || '').indexOf(q) !== -1;
      var okPhone = qd && String(p.phone).indexOf(qd) !== -1;
      if (!okName && !okPhone) return false;
    }
    return true;
  });

  $('count').textContent = list.length + ' من ' + ROWS.length + ' رقم';

  var box = $('list');
  box.innerHTML = '';
  if (!list.length){
    var e = document.createElement('div');
    e.className = 'empty';
    e.textContent = 'ما في أرقام بهالفلتر';
    box.appendChild(e);
    return;
  }

  var blocked = sentToday() >= DAILY_STOP;

  list.slice(0, 400).forEach(function(p){
    var isSent = !!log[p.phone];
    var row = document.createElement('div');
    row.className = 'person';

    var b = document.createElement('div');
    b.className = 'pb';
    var n = document.createElement('div');
    n.className = 'pn';
    n.textContent = p.name || '(بدون اسم)';
    if (p.used) n.appendChild(tag('زار المحل', 'used'));
    if (isSent) n.appendChild(tag('انبعتله', 'sent'));
    b.appendChild(n);

    var m = document.createElement('div');
    m.className = 'pm';
    var bits = [prettyPhone(p.phone)];
    if (p.date) bits.push('سجّل ' + p.date);
    if (p.times > 1) bits.push(p.times + ' لفّات');
    if (p.occasion) bits.push(p.occasion);
    m.textContent = bits.join('  ·  ');
    b.appendChild(m);
    row.appendChild(b);

    var a = document.createElement('a');
    a.className = 'wa' + (isSent ? ' done' : '');
    a.target = '_blank';
    a.rel = 'noopener';
    a.href = 'https://wa.me/' + waPhone(p.phone) + '?text=' + encodeURIComponent(buildMsg(p.name));
    a.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 00-8.6 15L2 22l5.2-1.3A10 10 0 1012 2zm5.1 14.1c-.2.6-1.2 1.2-1.7 1.2-.4 0-1 .1-3.2-.8-2.7-1.1-4.4-3.9-4.6-4.1-.1-.2-1-1.4-1-2.6s.6-1.8.9-2.1c.2-.2.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.3.3c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.1 1 2 1.3 2.3 1.4.2.1.4.1.6-.1l.8-1c.2-.2.3-.2.5-.1l2 .9c.2.1.4.2.4.3.1.2.1.7-.1 1.3z"/></svg>' +
      (isSent ? 'ابعت مرة تانية' : 'افتح واتساب');
    if (blocked && !isSent){
      a.removeAttribute('href');
      a.style.opacity = '.4';
      a.style.cursor = 'default';
      a.onclick = function(ev){ ev.preventDefault(); };
    } else {
      a.onclick = function(){
        var lg = sentLog();
        lg[p.phone] = today();
        saveLog(lg);
        setTimeout(function(){ paintMeter(); render(); }, 400);
      };
    }
    row.appendChild(a);

    if (isSent){
      var u = document.createElement('button');
      u.className = 'undo';
      u.type = 'button';
      u.title = 'شيل علامة "انبعتله"';
      u.textContent = '↺';
      u.onclick = function(){
        var lg = sentLog();
        delete lg[p.phone];
        saveLog(lg);
        paintMeter(); render();
      };
      row.appendChild(u);
    }

    box.appendChild(row);
  });
}

function tag(txt, cls){
  var s = document.createElement('span');
  s.className = 'tag ' + (cls || '');
  s.textContent = txt;
  return s;
}
</script>
</body>
</html>
